##############################################################
# Nginx config for HyderabadUrbanReality on DigitalOcean
# Place at: /etc/nginx/sites-available/hyderabad-urban-reality
# Then: sudo ln -s /etc/nginx/sites-available/hyderabad-urban-reality
#              /etc/nginx/sites-enabled/
##############################################################

server {
    listen 80;
    server_name _;          # Replace _ with your domain or droplet IP

    # -- Angular static files --
    root /var/www/hyderabad-urban-reality;
    index index.html;

    # Serve Angular app; fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -- .NET backend (/api) --
    location /api/ {
        proxy_pass         http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Don't expose internal server errors verbatim
        proxy_intercept_errors on;
    }

    # -- Flask scraper backend (/scraper) --
    # Admin-use only; restrict to trusted IPs if possible
    location /scraper/ {
        # Uncomment and set your office/home IP to restrict access:
        # allow 1.2.3.4;
        # deny all;

        rewrite ^/scraper/(.*) /$1 break;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # scraping can be slow
        proxy_send_timeout 600s;
    }

    # -- Security headers --
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # -- Gzip --
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary       on;

    # -- Cache static Angular assets --
    location ~* \.(js|css|woff2?|ttf|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -- Block access to dot-files --
    location ~ /\. {
        deny all;
    }
}
