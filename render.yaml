services:
  # ── .NET API ────────────────────────────────────────────────
  - type: web
    name: hydurban-api
    runtime: dotnet
    rootDir: backend-dotnet
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/HyderabadUrbanReality.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "false"
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
        # Set manually in Render dashboard — do NOT auto-generate
        # Value: Server=aws-0-ap-northeast-1.pooler.supabase.com;Port=6543;Database=postgres;User Id=postgres.qjgwnbszmojzgwmafvuc;Password=<SUPABASE_POOLER_PASSWORD>;SSL Mode=Require;Trust Server Certificate=true
      - key: AppSettings__JwtSecret
        sync: false
      - key: AppSettings__AdminUsername
        sync: false
      - key: AppSettings__AdminPasswordHash
        sync: false
      - key: SmtpSettings__Username
        sync: false
      - key: SmtpSettings__Password
        sync: false
      - key: SmtpSettings__FromEmail
        sync: false
      - key: SmtpSettings__AdminEmail
        sync: false
      - key: SmtpSettings__AppBaseUrl
        sync: false
      - key: ResendSettings__ApiKey
        sync: false
      - key: ResendSettings__FromEmail
        sync: false
      - key: ResendSettings__AdminEmail
        sync: false
      - key: SupabaseSettings__Url
        value: "https://qjgwnbszmojzgwmafvuc.supabase.co"
      - key: SupabaseSettings__ServiceKey
        sync: false
      - key: SupabaseSettings__Bucket
        value: "property-media"
      - key: FeatureFlags__UsePostgresRepository
        value: "true"
      - key: AppSettings__AllowedOrigins
        value: "https://hydurbanrealty.onrender.com,https://www.hyderabadurbanrealty.com,https://hyderabadurbanrealty.com,http://localhost:4200,https://localhost:4200"
      - key: GoogleAuth__ClientId
        value: "718846981675-ecdrldo2mls1k0qej6cu8h2jtphtovij.apps.googleusercontent.com"
      - key: GoogleAuth__ClientSecret
        sync: false
        # Set manually in Render dashboard — do NOT commit the actual value

  # ── Angular Static Site ─────────────────────────────────────
  - type: web
    name: hydurban-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build -- --configuration production && cp src/_redirects dist/hyderabad-urban-realty/_redirects
    staticPublishPath: dist/hyderabad-urban-realty
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hydurban-api.onrender.com/api/:splat
      - type: rewrite
        source: /media/*
        destination: https://hydurban-api.onrender.com/media/:splat
      - type: rewrite
        source: /*
        destination: /index.html
