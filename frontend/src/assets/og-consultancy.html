<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <title>Consultancy OG Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 1200px;
      height: 630px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0d3b73 0%, #1a5a9e 50%, #00bcd4 100%);
      position: relative;
      overflow: hidden;
    }
    
    /* Geometric pattern overlay */
    .pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.03) 35px, rgba(255,255,255,.03) 70px);
      opacity: 0.5;
    }
    
    /* Content container */
    .container {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
    }
    
    /* Header with logo */
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .brand {
      color: white;
    }
    
    .brand-name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    
    .brand-tagline {
      font-size: 14px;
      opacity: 0.9;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }
    
    /* Main content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 900px;
    }
    
    .badge {
      display: inline-block;
      background: rgba(0, 188, 212, 0.25);
      border: 2px solid rgba(0, 188, 212, 0.6);
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      margin-bottom: 30px;
      align-self: flex-start;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .title {
      font-size: 68px;
      font-weight: 800;
      color: white;
      line-height: 1.15;
      margin-bottom: 24px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    
    .title .highlight {
      color: #00bcd4;
      display: block;
      background: linear-gradient(90deg, #00bcd4, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 26px;
      color: rgba(255,255,255,0.95);
      line-height: 1.5;
      font-weight: 500;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    
    /* Footer stats */
    .footer {
      display: flex;
      gap: 60px;
      border-top: 2px solid rgba(255,255,255,0.2);
      padding-top: 30px;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-value {
      font-size: 38px;
      font-weight: 800;
      color: #00bcd4;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 6px;
    }
    
    .stat-label {
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* Decorative elements */
    .circle-decoration {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,188,212,0.15) 0%, transparent 70%);
    }
    
    .circle-1 {
      width: 400px;
      height: 400px;
      top: -150px;
      right: -100px;
    }
    
    .circle-2 {
      width: 300px;
      height: 300px;
      bottom: -100px;
      left: -50px;
    }
  </style>
</head>
<body>
  <div class="pattern"></div>
  <div class="circle-decoration circle-1"></div>
  <div class="circle-decoration circle-2"></div>
  
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="blue-Logo.png" alt="Hyderabad Urban Realty">
      </div>
      <div class="brand">
        <div class="brand-name">Hyderabad Urban Realty</div>
        <div class="brand-tagline">Property Intelligence Platform</div>
      </div>
    </div>
    
    <div class="content">
      <div class="badge">🏆 Expert Consultancy</div>
      <h1 class="title">
        Property Consultancy
        <span class="highlight">for Smarter Investments</span>
      </h1>
      <p class="subtitle">Data-driven insights • RERA verified • End-to-end support</p>
    </div>
    
    <div class="footer">
      <div class="stat">
        <div class="stat-value">500+</div>
        <div class="stat-label">Properties</div>
      </div>
      <div class="stat">
        <div class="stat-value">100%</div>
        <div class="stat-label">RERA Verified</div>
      </div>
      <div class="stat">
        <div class="stat-value">24/7</div>
        <div class="stat-label">Support</div>
      </div>
      <div class="stat">
        <div class="stat-value">Q4 2025</div>
        <div class="stat-label">Market Data</div>
      </div>
    </div>
  </div>
</body>
</html>
