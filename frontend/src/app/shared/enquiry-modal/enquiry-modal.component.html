<!-- Enquiry Modal -->
<div class="enq-modal-overlay" *ngIf="show" (click)="closeModal()" role="dialog" aria-modal="true">
  <div class="enq-modal" (click)="$event.stopPropagation()">

    <button class="enq-modal-close" (click)="closeModal()" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>

    <!-- Success -->
    <div class="enq-modal-success" *ngIf="enquirySuccess">
      <div class="enq-success-icon">
        <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      </div>
      <h3>We'll be in touch!</h3>
      <p>Our team will call you within 2 hours.</p>
      <button class="enq-modal-reset" (click)="closeModal()">Close</button>
    </div>

    <!-- Form -->
    <ng-container *ngIf="!enquirySuccess">
      <div class="enq-modal-header">
        <span class="enq-modal-eyebrow">Free Advisory</span>
        <h2 class="enq-modal-title">Tell us what you're weighing.</h2>
        <p class="enq-modal-sub">No call centre. No spam. Direct response within 2 hours.</p>
      </div>

      <div class="enq-modal-field">
        <label>Your Name <span style="color:#ef4444">*</span></label>
        <input type="text" [(ngModel)]="enquiryForm.name" placeholder="Full name" autocomplete="name" />
      </div>

      <div class="enq-modal-field">
        <label>Email Address <span style="color:#ef4444">*</span></label>
        <input type="email" [(ngModel)]="enquiryForm.email" placeholder="your.email@example.com" autocomplete="email" />
      </div>

      <div class="enq-modal-field">
        <label>Mobile Number <span style="color:#ef4444">*</span></label>
        <input type="tel" [(ngModel)]="enquiryForm.mobile" placeholder="10-digit mobile" maxlength="10" autocomplete="tel" />
      </div>

      <div class="enq-modal-field">
        <label>Area of Interest <span style="color:#94a3b8;font-weight:400">(optional)</span></label>
        <select [(ngModel)]="enquiryForm.interest">
          <option value="">Select area or project type</option>
          <option>Kokapet</option>
          <option>Narsingi</option>
          <option>Financial District</option>
          <option>Gachibowli</option>
          <option>Kondapur</option>
          <option>Tellapur</option>
          <option>Jubilee Hills</option>
          <option>Banjara Hills</option>
          <option>Residential Apartment</option>
          <option>Plotted Development</option>
          <option>Villa</option>
        </select>
      </div>

      <div class="enq-modal-captcha">
        <span class="enq-modal-captcha-eq">{{ enquiryCaptchaA }} + {{ enquiryCaptchaB }} = ?</span>
        <button type="button" class="enq-modal-captcha-refresh" (click)="refreshCaptcha()" title="New question">
          <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
        </button>
        <input type="number" [(ngModel)]="enquiryCaptchaAnswer" placeholder="Answer" class="enq-modal-captcha-input" />
        <span class="enq-captcha-ok"  *ngIf="enquiryCaptchaValid">✓</span>
        <span class="enq-captcha-err" *ngIf="enquiryCaptchaAnswer !== null && enquiryCaptchaAnswer !== '' && !enquiryCaptchaValid">✗</span>
      </div>

      <div class="enq-modal-error" *ngIf="enquiryError">{{ enquiryError }}</div>

      <button class="enq-modal-submit" (click)="submitEnquiry()" [disabled]="enquirySubmitting">
        <span *ngIf="!enquirySubmitting">
          Submit Enquiry
          <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </span>
        <span *ngIf="enquirySubmitting" class="enq-modal-spinner"></span>
      </button>

      <p class="enq-modal-trust">
        <svg viewBox="0 0 20 20" fill="currentColor" width="11" height="11"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>
        Your details are never shared without consent
      </p>
    </ng-container>
  </div>
</div>
