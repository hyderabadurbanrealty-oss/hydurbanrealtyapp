<!-- Floating Chat Button -->
<button class="chat-toggle" (click)="toggleChat()" [class.hidden]="isOpen" aria-label="Open chat">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </svg>
  <span class="chat-badge">AI</span>
</button>

<!-- Chat Window -->
<div class="chat-window" [class.open]="isOpen">
  <div class="chat-header">
    <div class="chat-header-content">
      <div class="chat-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </div>
      <div>
        <h3>Property Assistant</h3>
        <p class="chat-status">Online • Ready to help</p>
      </div>
    </div>
    <button class="chat-close" (click)="closeChat()" aria-label="Close chat">✕</button>
  </div>

  <div class="chat-body">
    <div *ngFor="let message of messages" class="message" [class.user]="message.sender === 'user'" [class.bot]="message.sender === 'bot'">
      <div class="message-content">
        <p [innerHTML]="message.text | replace: '\n':'<br>'"></p>
        <span class="message-time">{{ message.timestamp | date:'shortTime' }}</span>
      </div>
      
      <div *ngIf="message.options && message.options.length" class="message-options">
        <button 
          *ngFor="let option of message.options" 
          class="option-btn"
          (click)="selectOption(option)">
          {{ option }}
        </button>
      </div>
    </div>

    <div *ngIf="isTyping" class="message bot typing-indicator">
      <div class="message-content">
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <input 
      type="text" 
      class="chat-input" 
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      placeholder="Type your message..."
      [disabled]="isTyping">
    <button 
      class="chat-send" 
      (click)="sendMessage()"
      [disabled]="!userInput.trim() || isTyping"
      aria-label="Send message">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>
