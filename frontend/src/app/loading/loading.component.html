<div class="loading-overlay" *ngIf="isLoading$ | async" [class.fadeOut]="isHiding$ | async">
  <div class="loading-content">
    <div class="loading-spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
    </div>
    <h2 class="loading-title">Loading Property Details</h2>
    <p class="loading-text">Please wait while we fetch the property information...</p>
  </div>
</div>
